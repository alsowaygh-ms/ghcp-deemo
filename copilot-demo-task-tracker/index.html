<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header class="top-bar">
      <div>
        <p class="eyebrow">COPILOT DEMO</p>
        <h1>Task Tracker</h1>
      </div>
      <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
        Dark mode
      </button>
    </header>

    <form id="task-form">
      <label for="task-input">New task</label>
      <div class="input-row">
        <input id="task-input" name="task" type="text" placeholder="What needs to get done?" required autocomplete="off">
        <button type="submit">Add task</button>
      </div>
    </form>

    <section aria-labelledby="tasks-heading">
      <div class="list-heading">
        <h2 id="tasks-heading">Your tasks</h2>
        <p id="task-count" role="status">0 remaining</p>
      </div>
      <p id="empty-state">No tasks yet.</p>
      <ul id="task-list"></ul>
    </section>
    <noscript>JavaScript is required to manage tasks.</noscript>
  </main>
</body>
</html>
